name: Temporary V5 results import
on:
  push:
    branches: [paper/v5-evidence]
    paths:
      - '.github/workflows/v5_results_import_temp.yml'
permissions:
  contents: write
  actions: read
jobs:
  import-results:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy the V5 run's evaluation files into results/v5_run_40225195719
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/v5_import"
          mkdir -p "$tmp"
          gh run download 40225195719 --repo danielsemenovitch/GatorHack --name v5-final-research-checkpoint-and-matched-evaluation --dir "$tmp"
          echo "c8fad5a4a73f3e5bab61bee5e4ac3d69fd1174738736a486993cbbe3662017a5  $tmp/models/splice_cnn_v5.npz" | sha256sum --check
          find "$tmp" -type f -exec ls -la {} \;
          out=results/v5_run_40225195719
          mkdir -p "$out"
          cp "$tmp"/results/* "$out"/
          git rm -q .github/workflows/v5_results_import_temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          git commit -m 'Import V5 run 40225195719 evaluation files (checkpoint hash verified); remove temporary import workflow'
          git push origin HEAD:refs/heads/paper/v5-evidence
