name: Review report fixes and real paper CNN sanity check
on:
  push:
    branches: [fix/report-scores-duplicates-coverage-v3]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pip install "jax[cpu]" optax
      - name: Run backend regression tests
        run: python -m pytest -q tests/test_integrity_mvp.py tests/test_report_regressions.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Download trained v3 checkpoint (existing successful workflow artifact)
        run: |
          mkdir -p /tmp/v3-artifact
          gh run download 40130694228 --repo danielsemenovitch/GatorHack -n cnn-v3-expanded-results -D /tmp/v3-artifact
          test -s /tmp/v3-artifact/models/splice_cnn.npz
      - name: Evaluate v2 and v3 on the same unlabeled article
        run: python -u -m scripts.compare_real_article_cnn | tee real_paper_compare_log.txt
      - name: Save real-world model comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-paper-review-regressions
          path: |
            real_paper_compare_log.txt
            results/real_paper_cnn_comparison.json
          if-no-files-found: warn
