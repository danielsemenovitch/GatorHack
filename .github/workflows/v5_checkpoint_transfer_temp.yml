name: Temporary V5 checkpoint transfer
on:
  push:
    branches: [feature/v5-default-20261025]
    paths:
      - '.github/workflows/v5_checkpoint_transfer_temp.yml'
permissions:
  contents: write
  actions: read
jobs:
  import-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified trained V5 checkpoint from completed research run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/v5_import"
          gh run download 40225195719 --repo danielsemenovitch/GatorHack --name v5-final-research-checkpoint-and-matched-evaluation --dir "${RUNNER_TEMP}/v5_import"
          file="${RUNNER_TEMP}/v5_import/models/splice_cnn_v5.npz"
          test -s "${file}"
          echo "c8fad5a4a73f3e5bab61bee5e4ac3d69fd1174738736a486993cbbe3662017a5  ${file}" | sha256sum --check
          cp "${file}" models/splice_cnn_v5.npz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/splice_cnn_v5.npz
          git commit -m 'Include trained V5 residual CNN checkpoint for default scoring'
          git push origin HEAD:refs/heads/feature/v5-default-20261025
