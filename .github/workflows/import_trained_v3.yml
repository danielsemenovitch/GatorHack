name: Import trained CNN v3 checkpoint

on:
  push:
    branches: [fix/report-scores-duplicates-coverage-v3]
    paths: ['.github/workflows/import_trained_v3.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch successful trained v3 artifact
        run: |
          mkdir -p /tmp/cnn-artifact
          gh run download 40130694228 -n cnn-v3-expanded-results --repo danielsemenovitch/GatorHack -D /tmp/cnn-artifact
      - name: Verify and install additional checkpoint
        run: |
          python -m pip install numpy
          python - <<'PY'
          from pathlib import Path
          import shutil
          import numpy as np
          src=Path('/tmp/cnn-artifact/models/splice_cnn.npz')
          assert src.is_file()
          with np.load(src) as z:
              assert float(z['meta.threshold']) > 0
              assert z['meta.space'].item() == 'logit'
              assert z['meta.rule'].item() == 'top'
          shutil.copy2(src, 'models/splice_cnn_v3.npz')
          for src_name, dest_name in [
              ('cnn_metrics.json','cnn_v3_metrics.json'),
              ('cnn_expanded_comparison.json','cnn_expanded_comparison.json'),
              ('cnn_v2_expanded_test.json','cnn_v2_expanded_test.json'),
              ('robustness.json','cnn_v3_robustness.json'),
          ]:
              shutil.copy2(Path('/tmp/cnn-artifact/results')/src_name, Path('results')/dest_name)
          print('Installed verified CNN v3 artifact as separate experimental checkpoint')
          PY
      - name: Commit checkpoint and metrics to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/splice_cnn_v3.npz results/cnn_v3_metrics.json results/cnn_expanded_comparison.json results/cnn_v2_expanded_test.json results/cnn_v3_robustness.json
          if ! git diff --cached --quiet; then
            git commit -m "Add measured CNN v3 experimental checkpoint and reproducible metrics"
            git push origin HEAD:refs/heads/fix/report-scores-duplicates-coverage-v3
          fi
