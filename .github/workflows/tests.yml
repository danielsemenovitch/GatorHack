name: Tests and build
# Runs every backend test and the React build on pull requests and on main,
# so a regression is caught before a demo (the older workflows only ran on
# their own feature branches).
on:
  pull_request:
  push:
    branches: [main, audit/claude-2026-10-24]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pip install "jax[cpu]" optax
      - name: Backend tests
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend build
        working-directory: web
        run: npm ci && npm run build
