name: Live example analysis UI check
on:
  push:
    branches: [fix/reanalyze-example-images-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert example sources exist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for e in json.loads(Path('examples/examples.json').read_text()):
              assert Path('examples', e['file']).is_file(), e
          print('All live example source images exist')
          PY
      - name: Build React client
        working-directory: web
        run: npm ci && npm run build
