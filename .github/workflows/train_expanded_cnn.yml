name: Expanded CC BY blot CNN v3 training

on:
  push:
    branches:
      - experiment/cnn-v3-dataset-and-demo-20261024
    paths:
      - '.github/workflows/train_expanded_cnn.yml'
      - 'scripts/rehydrate_bundle2.py'
      - 'scripts/eval_old_cnn_on_new.py'
      - 'scripts/compare_expanded_cnn.py'
      - 'data/bundle2_pmcids.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML and image analysis dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "jax[cpu]" optax
      - name: Save unchanged v2 checkpoint for comparison
        run: |
          cp models/splice_cnn.npz models/splice_cnn_before_v3.npz
          cp results/cnn_metrics.json results/cnn_metrics_before_v3.json
      - name: Download original CC BY figures from the 241 additional papers
        run: python -u -m scripts.rehydrate_bundle2 2>&1 | tee results/rehydrate_log.txt
      - name: Extract blot panels and construct larger paper-disjoint benchmark
        run: python -u -m scripts.build_benchmark --n-clean 3 --n-forged 1 2>&1 | tee results/benchmark_v3_log.txt
      - name: Evaluate frozen original v2 on NEW benchmark test split
        run: python -u -m scripts.eval_old_cnn_on_new 2>&1 | tee results/cnn_v2_expanded_log.txt
      - name: Retrain CNN v3 with additional papers and calibration
        env:
          EPOCHS: '6'
          SKIP_HELDOUT: '1'
        run: python -u -m scripts.train_cnn 2>&1 | tee results/cnn_v3_training_log.txt
      - name: Compare CNN versions on the exact same held-out papers
        run: python -u -m scripts.compare_expanded_cnn
      - name: Stress test rebuilt CNN on publishing transforms
        run: python -u -m scripts.eval_robustness 2>&1 | tee results/cnn_v3_robustness_log.txt
      - name: Collect experiment metrics and both model checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnn-v3-expanded-results
          path: |
            results/bundle2_rehydration.json
            results/rehydrate_log.txt
            results/benchmark_v3_log.txt
            results/cnn_v2_expanded_test.json
            results/cnn_v2_expanded_log.txt
            results/cnn_metrics_before_v3.json
            results/cnn_metrics.json
            results/cnn_v3_training_log.txt
            results/cnn_expanded_comparison.json
            results/robustness.json
            results/cnn_v3_robustness_log.txt
            data/benchmark/index.json
            models/splice_cnn_before_v3.npz
            models/splice_cnn.npz
          if-no-files-found: warn
