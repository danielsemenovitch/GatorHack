name: Scientific integrity MVP checks

on:
  push:
    branches: [feature/scientific-integrity-mvp-20261024]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run synthetic integrity tests
        run: python -m pytest -q tests/test_integrity_mvp.py
      - name: Audit blot routing on original kept panels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          from btw.report import _blot_candidates
          paths = json.loads(Path("data/real_panels/keep.json").read_text())
          auto = manual = 0
          for path in paths:
              im = Image.open(Path("data/real_panels") / path).convert("RGB")
              auto += bool(_blot_candidates(im, "auto"))
              manual += bool(_blot_candidates(im, "blot"))
          print(f"BLOT ROUTE COVERAGE: auto={auto}/{len(paths)}, user-confirmed={manual}/{len(paths)} kept panels")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build React application
        working-directory: web
        run: npm ci && npm run build
