name: Conservative scientific blot screening and heat geometry
on:
  push:
    branches: [fix/conservative-screening-microscopy-heat-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pip install "jax[cpu]" optax
      - name: Regression tests
        run: python -m pytest -q tests/test_integrity_mvp.py tests/test_report_regressions.py tests/test_audit_regressions.py
      - name: Audit heat placement on whole Gemini blot
        run: python -u -m scripts.audit_gemini_heat
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build website
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conservative-heat-audit
          path: results/heat_overlay_audit/
          if-no-files-found: warn
