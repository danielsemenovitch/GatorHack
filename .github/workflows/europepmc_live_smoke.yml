name: Live Europe PMC integration smoke (opt-in)
on:
  workflow_dispatch:   # run by hand: it needs the internet and takes about a minute
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "jax[cpu]" optax
      - name: Query live Europe PMC and download actual paper figures
        run: |
          set -o pipefail
          python -m scripts.smoke_live_search | tee results/europepmc_live_smoke_log.txt
      - name: Save machine-readable online search outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: europepmc-live-agent-smoke
          retention-days: 7
          if-no-files-found: warn
          path: |
            results/europepmc_live_smoke.json
            results/europepmc_live_smoke_log.txt
