name: End-to-end PDF integrity demo and dataset access
on:
  push:
    branches: [experiment/cnn-v3-dataset-and-demo-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend
        run: python -m pip install -r requirements.txt
      - name: Controlled CC BY PDF integration test
        run: python -u -m scripts.smoke_paper_review
      - name: Probe dataset rehydration access
        continue-on-error: true
        run: python -u -m scripts.check_europepmc_access
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend and export review HTML
        working-directory: web
        run: |
          npm ci
          npm run build
          node scripts/smokeExport.mjs
      - name: Upload demo inputs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-pdf-demo
          path: results/integrity_smoke/
          if-no-files-found: warn
